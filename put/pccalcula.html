<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多行計算面板</title>

<style>
    body{
        margin:0;
        padding:30px;
        background:#f5f5f5;
        font-family:Arial, sans-serif;
    }

    .panel{
        max-width:800px;
        margin:auto;
    }

    h1{
        margin-bottom:20px;
    }

    textarea{
        width:100%;
        height:500px;
        font-size:22px;
        line-height:1.8;
        padding:20px;
        border-radius:12px;
        border:1px solid #ccc;
        resize:none;
        box-sizing:border-box;
        font-family:Consolas, monospace;
        background:white;
    }
</style>
</head>

<body>

<div class="panel">
    <h1>多行計算面板</h1>

    <textarea id="editor" placeholder="輸入例如：
1+1=
50*50=
100/5=
"></textarea>
</div>

<script>
const editor = document.getElementById("editor");

editor.addEventListener("keyup", function(e){

    // 偵測輸入 =
    if(e.key === "="){

        let lines = editor.value.split("\n");

        // 取得最後一行
        let currentLineIndex = lines.length - 1;
        let currentLine = lines[currentLineIndex];

        // 避免重複計算
        if(currentLine.includes("=")){
            
            let parts = currentLine.split("=");

            // 左邊公式
            let expression = parts[0].trim();

            // 如果右邊已有結果就不處理
            if(parts[1].trim() === ""){

                try{
                    let result = eval(expression);

                    // 限制小數位
                    result = parseFloat(result.toFixed(10));

                    // 補上結果
                    lines[currentLineIndex] = expression + "=" + result;

                    editor.value = lines.join("\n");
                }
                catch(err){
                    lines[currentLineIndex] = expression + "=錯誤";
                    editor.value = lines.join("\n");
                }
            }
        }
    }
});
</script>

</body>
</html>
