<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多行計算面板</title>

<style>
    body{
        margin:0;
        padding:10px;
        background:#f5f5f5;
        font-family:Arial, sans-serif;
    }

    .panel{
        max-width:800px;
        margin:auto;
    }

    h1{
        margin-bottom:20px;
    }

    textarea{
        width:100%;
        height:75vh;
        font-size:clamp(16px,4vw,22px);
        line-height:1.8;
        padding:20px;
        border-radius:12px;
        border:1px solid #ccc;
        resize:none;
        box-sizing:border-box;
        font-family:Consolas, monospace;
        background:white;
    }
</style>
</head>

<body>

<div class="panel">
    <h1>多行計算面板</h1>

    <textarea id="editor" placeholder="輸入例如：
1+1=
50*50=
100/5=
"></textarea>
</div>

<script>
const editor = document.getElementById("editor");

// 開啟時讀取
editor.value = localStorage.getItem("calcData") || "";

// 輸入時儲存
editor.addEventListener("input", () => {
    localStorage.setItem("calcData", editor.value);
});

editor.addEventListener("keyup", function(e){

    if(e.key === "="){

        let lines = editor.value.split("\n");

        let currentLineIndex = lines.length - 1;
        let currentLine = lines[currentLineIndex];

        if(currentLine.includes("=")){

            let parts = currentLine.split("=");

            let expression = parts[0].trim();

            if(parts[1].trim() === ""){

                try{
                    let result = eval(expression);

                    result = parseFloat(result.toFixed(10));

                    lines[currentLineIndex] =
                        expression + "=" + result;

                    editor.value = lines.join("\n");

                    localStorage.setItem(
                        "calcData",
                        editor.value
                    );

                }catch(err){

                    lines[currentLineIndex] =
                        expression + "=錯誤";

                    editor.value = lines.join("\n");

                    localStorage.setItem(
                        "calcData",
                        editor.value
                    );
                }
            }
        }
    }
});


</script>

</body>
</html>
