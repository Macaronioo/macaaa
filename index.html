<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具箱</title>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#f5f7fa,#e4ecf7);
}

.container{
    max-width:800px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
    font-size:14px;
}

/* 卡片 */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

.card{
    background:white;
    padding:18px;
    border-radius:14px;
    text-decoration:none;
    color:#333;
    box-shadow:0 4px 10px rgba(0,0,0,0.08);
    transition:0.2s;
    display:block;
}

.card:hover{
    transform:translateY(-3px);
    box-shadow:0 6px 14px rgba(0,0,0,0.12);
}

.icon{
    font-size:26px;
    margin-bottom:10px;
}

.title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:6px;
}

.path{
    font-size:12px;
    color:#999;
    margin-bottom:6px;
}

.desc{
    font-size:13px;
    color:#666;
}

/* 手機 */
@media (max-width:500px){
    .grid{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>工具箱</h1>
    <div class="subtitle">常用計算工具集合</div>

    <div class="grid">

        <a class="card" href="./calculator/">
            <div class="icon">🧮</div>
            <div class="title">計算器</div>
            <div class="path">/calculator/index.html</div>
            <div class="desc">多行公式計算 + 歷史紀錄</div>
        </a>

        <a class="card" href="./commission/">
            <div class="icon">💰</div>
            <div class="title">拆分計算</div>
            <div class="path">/commission/index.html</div>
            <div class="desc">業績抽成與多人拆帳</div>
        </a>

        <a class="card" href="./area/">
            <div class="icon">📐</div>
            <div class="title">坪數換算</div>
            <div class="path">/area/index.html</div>
            <div class="desc">坪 ↔ 平方公尺快速換算</div>
        </a>

    </div>

</div>

</body>
</html>
